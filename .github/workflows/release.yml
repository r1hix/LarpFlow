name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-gui:
    name: Build GUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: larpflow-gui
            asset_name: larpflow-gui-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: larpflow-gui
            asset_name: larpflow-gui-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: larpflow-gui
            asset_name: larpflow-gui-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: larpflow-gui.exe
            asset_name: larpflow-gui-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libxinerama-dev libxext-dev libwayland-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --manifest-path gui/Cargo.toml --target ${{ matrix.target }}

      - name: Package Unix assets
        if: runner.os != 'Windows'
        run: |
          cd gui/target/${{ matrix.target }}/release
          strip ${{ matrix.binary_name }} || true
          tar -czvf ../../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path gui/target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish Release
    needs: [build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python distribution (Wheel & sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cp dist/* release-assets/

      - name: Determine tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "LarpFlow ${{ steps.get_tag.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
